<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | AQUABIT</title>
  <link rel="stylesheet" href="/community/css/base.css?v=2">
  <link rel="stylesheet" href="/community/css/pages.css">
<link rel="stylesheet" href="/play/community-entry.css">
<link rel="stylesheet" href="/play/community-shared.css">
</head>
<body class="auth-page" data-community-page="login">
  <div class="auth-tank" id="bgTank"></div>
  <a class="wordmark-float pixel" href="/">AQUABIT</a>

  <main class="auth-card panel">
    <div class="auth-tabs" role="tablist" aria-label="로그인 또는 회원가입">
      <button class="auth-tab" role="tab" id="tabLogin" aria-controls="loginForm" aria-selected="true">로그인</button>
      <button class="auth-tab" role="tab" id="tabRegister" aria-controls="registerForm" aria-selected="false">회원가입</button>
    </div>

    <form id="loginForm" class="auth-form" role="tabpanel" aria-labelledby="tabLogin" novalidate>
      <h1 class="auth-title">로그인</h1>
      <div class="field">
        <label for="loginId">아이디</label>
        <input class="input" id="loginId" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPw">비밀번호</label>
        <input class="input" id="loginPw" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" role="alert" data-error></p>
      <button class="btn btn--sea btn--big auth-submit" type="submit">로그인</button>
    </form>

    <form id="registerForm" class="auth-form" role="tabpanel" aria-labelledby="tabRegister" hidden novalidate>
      <h1 class="auth-title">회원가입</h1>
      <div class="field">
        <label for="regId">아이디 <small>영문, 숫자, _ 4~20자</small></label>
        <input class="input" id="regId" name="username" autocomplete="username" minlength="4" maxlength="20" required>
      </div>
      <div class="field">
        <label for="regPw">비밀번호 <small>6자 이상</small></label>
        <input class="input" id="regPw" name="password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="field">
        <label for="regNick">닉네임 <small>팀원에게 보이는 이름, 12자까지</small></label>
        <input class="input" id="regNick" name="nickname" maxlength="12" required>
      </div>
      <p class="form-error" role="alert" data-error></p>
      <button class="btn btn--big auth-submit" type="submit">가입하고 시작하기</button>
    </form>
  <a class="preview-entry" href="/community/tank.html?id=1&amp;preview=1">체험하기 →</a><p class="preview-note">계정 없이 화면과 메뉴를 확인할 수 있어요.</p></main>

  
  
  
  
<script type="module" src="/play/community-entry.js"></script>
</body>
</html>
